<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Temporary Email</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">Temporary Email Box</h1>
                <p class="text-slate-400 text-sm">CORS-enabled live temporary inbox.</p>
            </div>
            <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Live Sync
            </span>
        </div>

        <!-- Address Bar -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Your Address</label>
            <div class="flex gap-2">
                <input type="text" id="emailDisplay" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-indigo-300 font-mono text-sm focus:outline-none" value="Connecting to server...">
                <button onclick="copyEmail()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition cursor-pointer flex items-center gap-1">
                    Copy
                </button>
                <button onclick="generateEmail()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition cursor-pointer flex items-center gap-1">
                    New
                </button>
            </div>
        </div>

        <!-- Inbox List -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-slate-200">Inbox</h2>
                <button onclick="checkInbox()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium cursor-pointer flex items-center gap-1">
                    ↻ Refresh
                </button>
            </div>
            
            <div id="inboxList" class="space-y-3 max-h-72 overflow-y-auto pr-1">
                <div class="text-center text-slate-500 py-10 text-sm">
                    Connecting to mail server...
                </div>
            </div>
        </div>
    </div>

    <!-- Message Viewer Modal -->
    <div id="messageModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-xl rounded-2xl p-6 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-start mb-4 pb-3 border-b border-slate-700">
                <div>
                    <h3 id="modalSubject" class="text-lg font-bold text-indigo-300 mb-1">Subject</h3>
                    <p id="modalFrom" class="text-xs text-slate-400">From: -</p>
                    <p id="modalDate" class="text-xs text-slate-500">Date: -</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 text-xl font-bold px-2 py-1 cursor-pointer">&times;</button>
            </div>
            <div id="modalBody" class="text-slate-200 text-sm overflow-y-auto space-y-2 flex-1 leading-relaxed bg-slate-900 p-4 rounded-xl border border-slate-700/50">
                Loading content...
            </div>
            <div class="mt-4 text-right">
                <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">
                    Close
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let sidToken = "";
        let currentEmail = "";

        // Generate a new temporary email session via Guerrilla Mail API
        async function generateEmail() {
            try {
                document.getElementById("emailDisplay").value = "Generating new address...";
                document.getElementById("inboxList").innerHTML = '<div class="text-center text-slate-500 py-10 text-sm">Setting up mailbox...</div>';

                const response = await fetch('https://api.guerrillamail.com/ajax.php?f=get_email_address');
                if (!response.ok) throw new Error("Network error fetching address");

                const data = await response.json();
                
                sidToken = data.sid_token;
                currentEmail = data.email_addr;

                document.getElementById("emailDisplay").value = currentEmail;
                checkInbox();
            } catch (error) {
                console.error("Error generating email:", error);
                document.getElementById("emailDisplay").value = "Connection error. Click 'New' to retry.";
                document.getElementById("inboxList").innerHTML = '<div class="text-center text-rose-400 py-8 text-sm">Failed to connect to GuerrillaMail server. Click "New" to try again.</div>';
            }
        }

        // Check inbox for incoming messages
        async function checkInbox() {
            if (!sidToken) return;

            try {
                const response = await fetch(`https://api.guerrillamail.com/ajax.php?f=check_email&sid_token=${encodeURIComponent(sidToken)}&seq=0`);
                if (!response.ok) return;

                const data = await response.json();
                const messages = data.list || [];
                const inboxList = document.getElementById("inboxList");

                if (messages.length === 0) {
                    inboxList.innerHTML = '<div class="text-center text-slate-500 py-10 text-sm">No messages yet. Send an email to the address above to test.</div>';
                    return;
                }

                inboxList.innerHTML = "";
                messages.forEach(msg => {
                    const card = document.createElement("div");
                    card.className = "bg-slate-900 border border-slate-700 p-4 rounded-xl hover:border-indigo-500/50 transition cursor-pointer";
                    card.onclick = () => readMessage(msg.mail_id);
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
                            <span class="font-semibold text-slate-300 truncate max-w-[200px]">${escapeHtml(msg.mail_from)}</span>
                            <span>${escapeHtml(msg.mail_date)}</span>
                        </div>
                        <div class="font-medium text-indigo-300 text-sm mb-1 truncate">${escapeHtml(msg.mail_subject || '(No Subject)')}</div>
                        <div class="text-xs text-slate-400 truncate">${escapeHtml(msg.mail_excerpt || '')}</div>
                    `;
                    inboxList.appendChild(card);
                });
            } catch (error) {
                console.error("Error checking inbox:", error);
            }
        }

        // Read message content inside modal dialog
        async function readMessage(mailId) {
            const modal = document.getElementById("messageModal");
            const modalSubject = document.getElementById("modalSubject");
            const modalFrom = document.getElementById("modalFrom");
            const modalDate = document.getElementById("modalDate");
            const modalBody = document.getElementById("modalBody");

            modalSubject.textContent = "Loading...";
            modalFrom.textContent = "From: -";
            modalDate.textContent = "Date: -";
            modalBody.innerHTML = '<p class="text-slate-500 italic">Fetching message content...</p>';
            modal.classList.remove("hidden");

            try {
                const response = await fetch(`https://api.guerrillamail.com/ajax.php?f=fetch_email&sid_token=${encodeURIComponent(sidToken)}&email_id=${encodeURIComponent(mailId)}`);
                const data = await response.json();

                modalSubject.textContent = data.mail_subject || "(No Subject)";
                modalFrom.textContent = `From: ${data.mail_from}`;
                modalDate.textContent = `Date: ${data.mail_date}`;
                
                // Display text body or sanitized HTML content
                if (data.mail_body) {
                    modalBody.innerHTML = data.mail_body;
                } else {
                    modalBody.textContent = "No content available.";
                }
            } catch (error) {
                console.error("Error reading message:", error);
                modalBody.textContent = "Error loading message details.";
            }
        }

        // Close reader modal
        function closeModal() {
            document.getElementById("messageModal").classList.add("hidden");
        }

        // Copy address to clipboard
        function copyEmail() {
            const emailInput = document.getElementById("emailDisplay");
            navigator.clipboard.writeText(emailInput.value);
            alert("Email copied to clipboard!");
        }

        // Prevent HTML injection
        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Start session and poll inbox every 8 seconds
        window.onload = () => {
            generateEmail();
            setInterval(checkInbox, 8000);
        };
    </script>
</body>
</html>
