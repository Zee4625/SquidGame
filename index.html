<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-mail Temporar Live</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">E-mail Temporar</h1>
                <p class="text-slate-400 text-sm">Actualizare automată la 20 de secunde fără lag.</p>
            </div>
            <span id="statusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                Autorefresh 20s
            </span>
        </div>

        <!-- Casetă Adresă -->
        <div class="mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Adresa ta temporară</label>
            <div class="flex gap-2">
                <input type="text" id="emailDisplay" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-indigo-300 font-mono text-sm focus:outline-none" value="Se conectează la server...">
                <button onclick="copyEmail()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition cursor-pointer">
                    Copiază
                </button>
                <button onclick="generateEmail()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition cursor-pointer">
                    Adresă nouă
                </button>
            </div>
        </div>

        <!-- Lista Inbox -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold text-slate-200">Mesaje primite</h2>
                <button onclick="checkInbox()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium cursor-pointer">
                    ↻ Verifică acum
                </button>
            </div>
            
            <div id="inboxList" class="space-y-3 max-h-72 overflow-y-auto pr-1">
                <div id="emptyPlaceholder" class="text-center text-slate-500 py-10 text-sm">
                    Se inițializează inbox-ul...
                </div>
            </div>
        </div>
    </div>

    <!-- Modal vizualizare e-mail -->
    <div id="messageModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-xl rounded-2xl p-6 shadow-2xl max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-start mb-4 pb-3 border-b border-slate-700">
                <div>
                    <h3 id="modalSubject" class="text-lg font-bold text-indigo-300 mb-1">Subiect</h3>
                    <p id="modalFrom" class="text-xs text-slate-400">De la: -</p>
                    <p id="modalDate" class="text-xs text-slate-500">Data: -</p>
                </div>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 text-xl font-bold px-2 py-1 cursor-pointer">&times;</button>
            </div>
            <div id="modalBody" class="text-slate-200 text-sm overflow-y-auto space-y-2 flex-1 leading-relaxed bg-slate-900 p-4 rounded-xl border border-slate-700/50">
                Se încarcă conținutul...
            </div>
            <div class="mt-4 text-right">
                <button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-xl text-xs font-semibold cursor-pointer">
                    Închide
                </button>
            </div>
        </div>
    </div>

    <!-- Script de funcționare -->
    <script>
        let sidToken = "";
        let currentEmail = "";
        let seenMailIds = new Set(); // Salvează ID-urile mesajelor deja afișate

        // Generează o nouă adresă temporară
        async function generateEmail() {
            try {
                sidToken = "";
                seenMailIds.clear(); // Resetează istoricul la o adresă nouă
                
                document.getElementById("emailDisplay").value = "Se generează adresa...";
                document.getElementById("inboxList").innerHTML = '<div id="emptyPlaceholder" class="text-center text-slate-500 py-10 text-sm">Se creează căsuța poștală...</div>';

                const response = await fetch('https://api.guerrillamail.com/ajax.php?f=get_email_address');
                if (!response.ok) throw new Error("Eroare de rețea");

                const data = await response.json();
                sidToken = data.sid_token;
                currentEmail = data.email_addr;

                document.getElementById("emailDisplay").value = currentEmail;
                checkInbox();
            } catch (error) {
                console.error("Eroare la generare:", error);
                document.getElementById("emailDisplay").value = "Eroare de conexiune. Apasă 'Adresă nouă'.";
            }
        }

        // Verifică mesajele noi fără reîncărcarea celor existente
        async function checkInbox() {
            if (!sidToken) return;

            try {
                const response = await fetch(`https://api.guerrillamail.com/ajax.php?f=check_email&sid_token=${encodeURIComponent(sidToken)}&seq=0`);
                if (!response.ok) return;

                const data = await response.json();
                const messages = data.list || [];
                const inboxList = document.getElementById("inboxList");

                // Filtrează doar mesajele pe care nu le-am afișat încă
                const newMessages = messages.filter(msg => !seenMailIds.has(msg.mail_id));

                if (newMessages.length > 0) {
                    // Șterge mesajul "Nu există mesaje" dacă este prezent
                    const emptyPlaceholder = document.getElementById("emptyPlaceholder");
                    if (emptyPlaceholder) emptyPlaceholder.remove();

                    // Adaugă doar mesajele noi în partea de sus
                    newMessages.forEach(msg => {
                        seenMailIds.add(msg.mail_id);

                        const card = document.createElement("div");
                        card.className = "bg-slate-900 border border-slate-700 p-4 rounded-xl hover:border-indigo-500/50 transition cursor-pointer mb-3";
                        card.onclick = () => readMessage(msg.mail_id);
                        
                        card.innerHTML = `
                            <div class="flex justify-between items-center text-xs text-slate-400 mb-1">
                                <span class="font-semibold text-slate-300 truncate max-w-[200px]">${escapeHtml(msg.mail_from)}</span>
                                <span>${escapeHtml(msg.mail_date)}</span>
                            </div>
                            <div class="font-medium text-indigo-300 text-sm mb-1 truncate">${escapeHtml(msg.mail_subject || '(Fără Subiect)')}</div>
                            <div class="text-xs text-slate-400 truncate">${escapeHtml(msg.mail_excerpt || '')}</div>
                        `;
                        
                        inboxList.prepend(card); // Adaugă mesajul cel nou în sus
                    });
                } else if (seenMailIds.size === 0) {
                    inboxList.innerHTML = '<div id="emptyPlaceholder" class="text-center text-slate-500 py-10 text-sm">Nu există mesaje încă. Trimiterea unui e-mail la adresa de mai sus va fi afișată aici...</div>';
                }
            } catch (error) {
                console.error("Eroare la verificarea inbox-ului:", error);
            }
        }

        // Citește conținutul unui mesaj
        async function readMessage(mailId) {
            const modal = document.getElementById("messageModal");
            const modalSubject = document.getElementById("modalSubject");
            const modalFrom = document.getElementById("modalFrom");
            const modalDate = document.getElementById("modalDate");
            const modalBody = document.getElementById("modalBody");

            modalSubject.textContent = "Se încarcă...";
            modalFrom.textContent = "De la: -";
            modalDate.textContent = "Data: -";
            modalBody.innerHTML = '<p class="text-slate-500 italic">Se descarcă e-mailul...</p>';
            modal.classList.remove("hidden");

            try {
                const response = await fetch(`https://api.guerrillamail.com/ajax.php?f=fetch_email&sid_token=${encodeURIComponent(sidToken)}&email_id=${encodeURIComponent(mailId)}`);
                const data = await response.json();

                modalSubject.textContent = data.mail_subject || "(Fără Subiect)";
                modalFrom.textContent = `De la: ${data.mail_from}`;
                modalDate.textContent = `Data: ${data.mail_date}`;
                
                modalBody.innerHTML = data.mail_body || "Mesajul este gol.";
            } catch (error) {
                console.error("Eroare la citirea mesajului:", error);
                modalBody.textContent = "Nu s-a putut încărca mesajul.";
            }
        }

        // Închide fereastra modală
        function closeModal() {
            document.getElementById("messageModal").classList.add("hidden");
        }

        // Copiază e-mailul în clipboard
        function copyEmail() {
            const emailInput = document.getElementById("emailDisplay");
            navigator.clipboard.writeText(emailInput.value);
            alert("Adresa a fost copiată!");
        }

        // Sanitizează caracterele HTML speciale
        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Inițializare și verificare automată la fiecare 20 de secunde (20000 ms)
        window.onload = () => {
            generateEmail();
            setInterval(checkInbox, 20000);
        };
    </script>
</body>
</html>
