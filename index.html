<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Temporary Email Box</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold mb-2 text-center text-indigo-400">Temporary Email Box</h1>
        <p class="text-slate-400 text-sm text-center mb-6">Your live disposable inbox checks automatically every 10 seconds.</p>

        <!-- Email Display Section -->
        <div class="mb-6">
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Your Temp Email Address</label>
            <div class="flex gap-2">
                <input type="text" id="emailDisplay" readonly class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-indigo-300 font-mono text-sm focus:outline-none" value="Initializing...">
                <button onclick="copyEmail()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">Copy</button>
                <button onclick="generateEmail()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition cursor-pointer">New</button>
            </div>
        </div>

        <!-- Inbox Section -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-lg font-semibold">Inbox</h2>
                <button onclick="checkInbox()" class="text-xs text-indigo-400 hover:text-indigo-300 underline cursor-pointer">Refresh Now</button>
            </div>
            
            <div id="inboxList" class="space-y-3 max-h-60 overflow-y-auto pr-1">
                <div class="text-center text-slate-500 py-6 text-sm">No messages yet. Waiting for incoming mail...</div>
            </div>
        </div>
        
        <!-- Attribution requirement for mail.tm -->
        <div class="mt-6 text-center text-xs text-slate-500">
            Powered by <a href="https://mail.tm" target="_blank" class="underline hover:text-slate-400">mail.tm</a>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentEmail = "";
        let currentPassword = "";
        let currentToken = "";

        // Function to create a brand new email account using mail.tm API
        async function generateEmail() {
            try {
                document.getElementById("emailDisplay").value = "Fetching domain...";
                document.getElementById("inboxList").innerHTML = '<div class="text-center text-slate-500 py-6 text-sm">Setting up inbox...</div>';

                // 1. Get available domains
                const domainRes = await fetch('https://api.mail.tm/domains');
                const domainData = await domainRes.json();
                const domains = domainData['hydra:member'] || domainData;
                
                if (!domains || domains.length === 0) throw new Error("No domains available");
                const selectedDomain = domains[0].domain;

                // 2. Generate random credentials
                const randomUser = Math.random().toString(36.substring(2), 11) + Math.random().toString(36).substring(2, 7);
                currentEmail = `${randomUser}@${selectedDomain}`;
                currentPassword = "Pass" + Math.random().toString(36).substring(2, 10) + "!";

                // 3. Register the account
                const regRes = await fetch('https://api.mail.tm/accounts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: currentEmail, password: currentPassword })
                });

                if (!regRes.ok) throw new Error("Failed to create account");

                // 4. Authenticate/Get Token
                const tokenRes = await fetch('https://api.mail.tm/token', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: currentEmail, password: currentPassword })
                });

                const tokenData = await tokenRes.json();
                currentToken = tokenData.token;

                if (!currentToken) throw new Error("Failed to authenticate session");

                document.getElementById("emailDisplay").value = currentEmail;
                document.getElementById("inboxList").innerHTML = '<div class="text-center text-slate-500 py-6 text-sm">No messages yet. Waiting for incoming mail...</div>';
            } catch (error) {
                console.error("Error generating email:", error);
                document.getElementById("emailDisplay").value = "Error generating email. Click 'New'.";
                document.getElementById("inboxList").innerHTML = '<div class="text-center text-rose-400 py-6 text-sm">Failed to connect to mail server. Try clicking "New".</div>';
            }
        }

        // Function to check the inbox for messages
        async function checkInbox() {
            if (!currentToken) return;

            try {
                const response = await fetch('https://api.mail.tm/messages', {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                
                if (!response.ok) return;
                
                const data = await response.json();
                const messages = data['hydra:member'] || data;
                
                const inboxList = document.getElementById("inboxList");

                if (!messages || messages.length === 0) {
                    return; 
                }

                inboxList.innerHTML = "";
                messages.forEach(msg => {
                    const msgCard = document.createElement("div");
                    msgCard.className = "bg-slate-900 border border-slate-700 p-3 rounded-lg text-sm";
                    msgCard.innerHTML = `
                        <div class="flex justify-between text-xs text-slate-400 mb-1">
                            <span class="font-semibold text-slate-300">${escapeHtml(msg.from.address)}</span>
                            <span>${new Date(msg.createdAt).toLocaleTimeString()}</span>
                        </div>
                        <div class="font-medium text-indigo-300">${escapeHtml(msg.subject || '(No Subject)')}</div>
                        <button onclick="readMessage('${msg.id}')" class="mt-2 text-xs text-indigo-400 hover:text-indigo-300 underline cursor-pointer">Read Message</button>
                    `;
                    inboxList.appendChild(msgCard);
                });
            } catch (error) {
                console.error("Error checking inbox:", error);
            }
        }

        // Function to read a specific message content
        async function readMessage(id) {
            try {
                const response = await fetch(`https://api.mail.tm/messages/${id}`, {
                    headers: { 'Authorization': `Bearer ${currentToken}` }
                });
                const msg = await response.json();
                
                let bodyContent = msg.text || msg.intro || "No text body found.";
                alert(`From: ${msg.from.address}\nSubject: ${msg.subject}\n\nBody:\n${bodyContent}`);
            } catch (error) {
                console.error("Error reading message:", error);
                alert("Could not load message body.");
            }
        }

        // Helper to copy text to clipboard
        function copyEmail() {
            const emailInput = document.getElementById("emailDisplay");
            navigator.clipboard.writeText(emailInput.value);
            alert("Email copied to clipboard!");
        }

        // Simple HTML escape to prevent injection
        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initialize on load and poll every 10 seconds
        window.onload = () => {
            generateEmail();
            setInterval(checkInbox, 10000);
        };
    </script>
</body>
</html>
